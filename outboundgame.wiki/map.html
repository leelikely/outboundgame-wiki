<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map - Outbound Game Wiki</title>
    <meta name="description" content="Interactive world map for Outbound. Switch between The Outdoors and The Coast regions. Zoom and pan to explore.">
    <link rel="canonical" href="https://outboundgame.wiki/map.html">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        #map-container {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            margin: 24px 0;
            background: #f0ede5;
        }
        .map-switcher {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .map-switcher button {
            padding: 10px 24px;
            background: #fff;
            border: 2px solid var(--accent, #e3875b);
            color: var(--accent, #e3875b);
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-family: inherit;
        }
        .map-switcher button.active {
            background: var(--accent, #e3875b);
            color: white;
        }
        .map-switcher button:hover {
            background: var(--accent-hover, #c96e44);
            border-color: var(--accent-hover, #c96e44);
            color: white;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <!-- Monetag MultiTag -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="238342" async data-cfasync="false"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="page-content">
        <h1>World Map</h1>
        <p>Explore the world of Outbound. Use the buttons to switch between regions. Drag to pan, scroll to zoom.</p>
        
        <div class="map-switcher">
            <button id="btn-outdoors" class="active">The Outdoors</button>
            <button id="btn-coast">The Coast</button>
        </div>

        <div id="map-container"></div>

        <p style="margin-top: 16px; color: #888; font-size: 0.9em;">
            Map images are fan-provided. All game rights belong to the developers.
        </p>
    </main>

    <footer id="footer"></footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        // 等待页面完全加载（包括图片、样式等）
        window.addEventListener('load', function() {
            if (typeof loadNavbar === 'function') {
                loadNavbar();
                if (typeof setupMobileMenu === 'function') setupMobileMenu();
            }
            if (typeof loadFooter === 'function') {
                loadFooter();
            }

            const maps = {
                outdoors: '/images/outdoors-map.jpg',
                coast: '/images/coast-map.jpg'
            };
            let currentMap = 'outdoors';
            let imageOverlay = null;
            let mapInitialized = false;

            const map = L.map('map-container', {
                crs: L.CRS.Simple,
                minZoom: -2,
                maxZoom: 3,
                zoomSnap: 0.5,
                zoomDelta: 0.5,
                attributionControl: false
            });

            window.addEventListener('resize', function() {
                map.invalidateSize();
                if (imageOverlay) {
                    const bounds = imageOverlay.getBounds();
                    map.fitBounds(bounds, { padding: [10, 10], maxZoom: 2 });
                }
            });

            function loadMap(mapType) {
                const img = new Image();
                img.onload = function() {
                    const w = img.width;
                    const h = img.height;
                    const bounds = [[0,0], [h, w]];
                    if (imageOverlay) { map.removeLayer(imageOverlay); }
                    imageOverlay = L.imageOverlay(maps[mapType], bounds).addTo(map);
                    map.invalidateSize();
                    map.fitBounds(bounds, { padding: [10, 10], maxZoom: 1.5, animate: false });
                    if (!mapInitialized) {
                        map.setMinZoom(map.getZoom() - 1);
                        mapInitialized = true;
                    }
                };
                img.onerror = function() {
                    console.error('Failed to load map image:', maps[mapType]);
                    alert('Map image not found. Please check the file path and name.');
                };
                img.src = maps[mapType];
            }

            loadMap('outdoors');

            document.getElementById('btn-outdoors').addEventListener('click', function() {
                if (currentMap !== 'outdoors') {
                    currentMap = 'outdoors';
                    loadMap('outdoors');
                    document.getElementById('btn-outdoors').classList.add('active');
                    document.getElementById('btn-coast').classList.remove('active');
                }
            });
            document.getElementById('btn-coast').addEventListener('click', function() {
                if (currentMap !== 'coast') {
                    currentMap = 'coast';
                    loadMap('coast');
                    document.getElementById('btn-coast').classList.add('active');
                    document.getElementById('btn-outdoors').classList.remove('active');
                }
            });
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
